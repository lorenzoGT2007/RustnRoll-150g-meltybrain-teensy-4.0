; PlatformIO Project Configuration File
;
; One source file = one build environment. Every environment compiles a single
; .cpp from src/ (selected with build_src_filter), so the mains never clash.
;
;   MAIN  (default build)  -> src/main_Degrees_Singlemotor_Sinusoidal.cpp
;   TESTS (pick manually)  -> src/test_*.cpp
;
; Build the main:            pio run
; Build a test variant:      pio run -e test_Degrees_Singlemotor_noPID
; (or pick the environment from the PlatformIO toolbar in VS Code)
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Degrees_Singlemotor_Sinusoidal

; common settings shared by every environment
[env]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
  adafruit/Adafruit BusIO@^1.17.2
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit LIS331@^1.0.6

; ============================== MAIN BUILD ==============================
[env:Degrees_Singlemotor_Sinusoidal]
build_src_filter = +<main_Degrees_Singlemotor_Sinusoidal.cpp>

; ============================== TEST BUILDS =============================
; revamped single motor firmware: PID + activation window + bugfixes
[env:test_Degrees_Singlemotor_sinusoidal]
build_src_filter = +<test_Degrees_Singlemotor_sinusoidal.cpp>

; simplest variant: throttle straight from CH3, no PID
[env:test_Degrees_Singlemotor_noPID]
build_src_filter = +<test_Degrees_Singlemotor_noPID.cpp>

; both motors sinusoidally modulated, 180 deg out of phase
[env:test_Degrees_Doublemotor_Sinusoidal]
build_src_filter = +<test_Degrees_Doublemotor_Sinusoidal.cpp>
